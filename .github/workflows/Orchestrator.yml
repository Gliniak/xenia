name: Orchestrator

on:
  push:
    branches:
      - canary_experimental
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.azure-pipelines.yml'
  pull_request:
    branches:
      - canary_experimental
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Pre-requirements
  # ===========================================================================

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  # Add optional steps here

  # ===========================================================================
  # Stage 2: Platform builds
  # ===========================================================================

  build-windows:
    name: Windows
    needs: [lint]
    uses: ./.github/workflows/build-windows.yml
    with:
      config: release

  build-linux:
    name: Linux
    needs: [lint]
    uses: ./.github/workflows/build-linux.yml
    with:
      config: release

  # Uncomment when platform support is ready:
  # build-windows-arm64:
  #   name: Windows-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-win_arm64.yml
  #   with:
  #     config: release

  # build-linux-arm64:
  #   name: Linux-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-linux_arm64.yml
  #   with:
  #     config: release

  # build-macos:
  #   name: macOS
  #   needs: [lint]
  #   uses: ./.github/workflows/build-macos.yml
  #   with:
  #     config: release

  # build-android:
  #   name: Android
  #   needs: [lint]
  #   uses: ./.github/workflows/build-android.yml
  #   with:
  #     config: release

  # ===========================================================================
  # Stage 3: Release
  # ===========================================================================
  # Runs after ALL builds finish (success or failure).
  # Creates a release if at least one platform built successfully.
  # Skipped only if every single build failed or lint failed.
  # ===========================================================================

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    if: |
      always() &&
      github.repository == 'xenia-canary/xenia-canary' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/canary_experimental' &&
      (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
    uses: ./.github/workflows/create-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ github.sha }}
      commit_message: ${{ github.event.head_commit.message }}
      has_windows: ${{ needs.build-windows.result == 'success' }}
      has_linux: ${{ needs.build-linux.result == 'success' }}
      # has_macos: ${{ needs.build-macos.result == 'success' }}
      # has_android: ${{ needs.build-android.result == 'success' }}