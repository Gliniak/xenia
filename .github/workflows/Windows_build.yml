name: Windows build

on:
  push:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.gdbinit'
      - '.github/*'
      - '.github/workflows/Linux_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.md'
      - '*.yml'
      - '*.txt'
      - 'docs/**'
      - 'src/**/*_posix.*'
      - 'src/**/*_linux.*'
      - 'src/**/*_gnulinux.*'
      - 'src/**/*_x11.*'
      - 'src/**/*_gtk.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.clang-format'
      - '.drone.star'
      - '.gitattributes'
      - '.gitignore'
      - '.gdbinit'
      - '.github/*'
      - '.github/workflows/Linux_build.yml'
      - '.github/*_TEMPLATE/**'
      - '*.md'
      - '*.yml'
      - '*.txt'
      - 'docs/**'
      - 'src/**/*_posix.*'
      - 'src/**/*_linux.*'
      - 'src/**/*_gnulinux.*'
      - 'src/**/*_x11.*'
      - 'src/**/*_gtk.*'
      - 'src/**/*_android.*'
      - 'src/**/*_mac.*'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Check Clang-Format Version
        run: clang-format --version
      - name: Lint
        run: .\xb lint --all

  build-windows:
    name: Build (Windows, VS${{ matrix.vsver }}) #  runner.os can't be used here
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        vsver: [2022]
    runs-on: windows-${{ matrix.vsver }}
    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Setup
        run: |
            echo "dummy"
        #run: .\xb setup
      - name: Build
        run: |
            echo "dummy"
        #run: .\xb build --config=Release --target=src\xenia-app
      - name: Prepare artifacts
        id: prepare_artifacts
        run: |
          robocopy . build\bin\Windows\Release                                                                        LICENSE /r:0 /w:0
          robocopy   build\bin\Windows\Release artifacts\xenia_canary_windows   xenia_canary.exe   xenia_canary.pdb   LICENSE /r:0 /w:0
          If ($LastExitCode -le 7) { echo "LastExitCode = $LastExitCode";$LastExitCode = 0 }
      - name: Upload xenia canary artifacts
        if: steps.prepare_artifacts.outcome == 'success'
        id: upload_artifacts
        uses: actions/upload-artifact@main
        with:
          name: xenia_canary_vs${{ matrix.vsver }}
          path: artifacts/xenia_canary_windows
          if-no-files-found: error